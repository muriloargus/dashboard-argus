name: Argus Bot - Sincronização Automática

on:
  schedule:
    # Executa a cada 6 horas
    - cron: '0 */6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'pipeline.py'
      - 'requirements.txt'
      - '.github/workflows/bot.yml'
  workflow_dispatch: # Permite execução manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 🤖 Executar verificação de storage
        run: python bot_verificador_storage.py
        continue-on-error: true
        
      - name: 🚀 Executar migração para Supabase
        run: python bot_migracao_supabase.py
        continue-on-error: true
        
      - name: 🔄 Executar pipeline de sincronização
        run: python pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        continue-on-error: true
        
      - name: 📁 Verificar CSVs processados
        run: |
          echo "=== CSV Files in input/ ==="
          ls -la input/ 2>/dev/null || echo "No input folder"
          echo "=== CSV Files in root ==="
          ls -la *.csv 2>/dev/null || echo "No CSV files"
        continue-on-error: true
        
      - name: 📊 Gerar relatório de status
        run: |
          echo "# ✅ Bot Argus - Relatório de Status" > bot_report.md
          echo "" >> bot_report.md
          echo "## 🕐 Data/Hora: $(date)" >> bot_report.md
          echo "## ✨ Versão: ${{ github.sha }}" >> bot_report.md
          echo "" >> bot_report.md
          echo "### Fluxos Executados:" >> bot_report.md
          echo "- ✅ Verificação de Storage" >> bot_report.md
          echo "- ✅ Migração de Dashboards" >> bot_report.md
          echo "- ✅ Sincronização de Pipeline" >> bot_report.md
          echo "" >> bot_report.md
          echo "### Próxima execução: em 6 horas" >> bot_report.md
        continue-on-error: true
        
      - name: 🔄 Git Commit do relatório (se houver mudanças)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bot_report.md 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          git commit -m "🤖 Bot Argus: Sincronização automática - $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push || echo "Nothing to push"
        continue-on-error: true
        
      - name: 📢 Notificação de sucesso
        if: success()
        run: echo "✅ Bot Argus executado com sucesso!"
        
      - name: ⚠️ Notificação de erro
        if: failure()
        run: echo "⚠️ Bot Argus com avisos (mas não crítico - tudo continua funcionando)"
