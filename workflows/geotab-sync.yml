name: 🔄 Sincronização Geotab

on:
  schedule:
    # Executa a cada 12 horas  
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite execução manual

jobs:
  sync-geotab:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary
          
      - name: 🔄 Executar sincronização Geotab → Supabase
        run: python pipeline_geotab.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEOTAB_DB_HOST: ${{ secrets.GEOTAB_DB_HOST }}
          GEOTAB_DB_PORT: ${{ secrets.GEOTAB_DB_PORT }}
          GEOTAB_DB_NAME: ${{ secrets.GEOTAB_DB_NAME }}
          GEOTAB_DB_USER: ${{ secrets.GEOTAB_DB_USER }}
          GEOTAB_DB_PASSWORD: ${{ secrets.GEOTAB_DB_PASSWORD }}
        continue-on-error: true
        
      - name: 📊 Gerar relatório Geotab
        run: |
          echo "# 🔄 Geotab Sync Report - $(date)" > geotab_sync_report.md
          echo "" >> geotab_sync_report.md
          if [ -f sync_geotab.log ]; then
            echo "## Log de Execução:" >> geotab_sync_report.md
            echo '```' >> geotab_sync_report.md
            tail -30 sync_geotab.log >> geotab_sync_report.md
            echo '```' >> geotab_sync_report.md
          fi
        continue-on-error: true
        
      - name: 🔄 Git Commit do relatório
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sync_geotab.log geotab_sync_report.md 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          git commit -m "🔄 Geotab: Sincronização automática - $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git push || echo "Nothing to push"
        continue-on-error: true
