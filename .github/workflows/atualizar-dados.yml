name: 📊 Sincronizar Dados com Supabase

on:
  # Executa a cada 6 horas
  schedule:
    - cron: '0 */6 * * *'
  
  # Permite execução manual
  workflow_dispatch:
  
  # Executa quando arquivos CSV são alterados
  push:
    paths:
      - '*.csv'
      - 'input/**'

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Criar arquivo .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "CSV_FOLDER=./input" >> .env
      
      - name: Executar pipeline de sincronização
        run: |
          python pipeline.py
      
      - name: Upload logs de execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 30
      
      - name: Notificar sucesso
        if: success()
        run: |
          echo "✅ Sincronização concluída com sucesso!"
      
      - name: Notificar erro
        if: failure()
        run: |
          echo "❌ Erro na sincronização. Verifique os logs."
          exit 1

  # Job opcional: validar dados
  validate-data:
    runs-on: ubuntu-latest
    needs: sync-data
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      
      - name: Validar dados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python -c "
          import requests
          import os
          
          url = os.getenv('SUPABASE_URL')
          key = os.getenv('SUPABASE_ANON_KEY')
          
          headers = {
              'apikey': key,
              'Authorization': f'Bearer {key}'
          }
          
          # Verifica tabela ativos
          response = requests.get(f'{url}/rest/v1/ativos?select=count(*)', headers=headers)
          if response.ok:
              print(f'✅ Ativos: {len(response.json())} registros')
          else:
              print('⚠️  Erro ao validar ativos')
          "
