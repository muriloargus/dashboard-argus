name: Deploy Shiny Dashboards

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: r-lib/setup-r@v2
        with:
          r-version: 4.3.0
      
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      
      - run: Rscript -e "install.packages(c('shiny','shinydashboard','plotly','dplyr','readr','reactable','rsconnect'))"
      
      - run: Rscript -e "rsconnect::setAccountInfo(name='${{ secrets.POSIT_ACCOUNT_NAME }}', token='${{ secrets.POSIT_TOKEN }}', secret='${{ secrets.POSIT_SECRET }}')"
      
      - run: |
          Rscript << 'EOFR'
          apps <- c('dashboard_menu','dashboard_ativos','dashboard_usuarios','dashboard_motoristas','dashboard_falhas','dashboard_dispositivos','dashboard_excecoes','dashboard_timeline','dashboard_temporal_mapas','dashboard_risco_colisao','dashboard_desempenho_analista','dashboard_comparativo','dashboard_ativos_supabase','dashboard_falhas_supabase','dashboard_usuarios_supabase')
          for(app in apps) { cat(paste0('Deploying ',app,'...\n')); rsconnect::deployApp(appDir=paste0('shiny/',app), appName=app, forceUpdate=TRUE) }
          EOFR

      - name: Deploy Dashboard Menu
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_menu',
            appName = 'dashboard_menu',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Ativos
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_ativos',
            appName = 'dashboard_ativos',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Usuarios
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_usuarios',
            appName = 'dashboard_usuarios',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Motoristas
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_motoristas',
            appName = 'dashboard_motoristas',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Falhas
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_falhas',
            appName = 'dashboard_falhas',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Dispositivos
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_dispositivos',
            appName = 'dashboard_dispositivos',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Excecoes
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_excecoes',
            appName = 'dashboard_excecoes',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Timeline
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_timeline',
            appName = 'dashboard_timeline',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Temporal Mapas
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_temporal_mapas',
            appName = 'dashboard_temporal_mapas',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Risco Colisao
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_risco_colisao',
            appName = 'dashboard_risco_colisao',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Desempenho Analista
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_desempenho_analista',
            appName = 'dashboard_desempenho_analista',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Comparativo
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_comparativo',
            appName = 'dashboard_comparativo',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Ativos Supabase
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_ativos_supabase',
            appName = 'dashboard_ativos_supabase',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Falhas Supabase
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_falhas_supabase',
            appName = 'dashboard_falhas_supabase',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deploy Dashboard Usuarios Supabase
        run: |
          Rscript -e "
          rsconnect::deployApp(
            appDir = 'shiny/dashboard_usuarios_supabase',
            appName = 'dashboard_usuarios_supabase',
            account = '${{ secrets.POSIT_ACCOUNT_NAME }}',
            launch.browser = FALSE,
            forceUpdate = TRUE
          )
          "

      - name: Deployment Summary
        if: always()
        run: |
          echo "✅ Deploy workflow completed!"
          echo "Dashboard URLs:"
          echo "https://${{ secrets.POSIT_ACCOUNT_NAME }}.shinyapps.io/dashboard_menu/"
          echo "https://${{ secrets.POSIT_ACCOUNT_NAME }}.shinyapps.io/dashboard_ativos/"
          echo "https://${{ secrets.POSIT_ACCOUNT_NAME }}.shinyapps.io/dashboard_usuarios/"
